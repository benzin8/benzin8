<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 90" width="1200" height="90">
  <defs>
    <filter id="wobble">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="1" result="n">
        <animate attributeName="seed" values="1;4;7;2" dur="0.5s" calcMode="discrete" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3"/>
    </filter>
    <pattern id="stripes" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="20" height="40" fill="#f4f1e8"/>
      <rect x="20" width="20" height="40" fill="#0b0712"/>
      <animateTransform attributeName="patternTransform" type="translate" additive="sum" from="0 0" to="-40 0" dur="2s" repeatCount="indefinite"/>
    </pattern>
  </defs>
  <rect width="1200" height="90" fill="#0b0712"/>
  <rect y="0" width="1200" height="10" fill="url(#stripes)"/>
  <rect y="80" width="1200" height="10" fill="url(#stripes)"/>
  <g filter="url(#wobble)" font-family="Arial Black, Impact, sans-serif" font-size="30" text-anchor="middle" stroke="#0b0712" stroke-width="3" paint-order="stroke">
    <text x="600" y="58">
      <tspan fill="#f4f1e8">THANKS </tspan><tspan fill="#f4f1e8">FOR </tspan><tspan fill="#f4f1e8">DROPPING </tspan><tspan fill="#f4f1e8">BY </tspan><tspan fill="#e8202a">— DON'T BE DUMB</tspan>
      <animate attributeName="opacity" values="1;0.75;1" dur="1.2s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
